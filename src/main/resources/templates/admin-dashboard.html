<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRUD CTF - ADMIN COMMAND CENTER</title>
    <style>
        body {
            background-color: #050000;
            color: #ff4d4d;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            margin: 0;
            background-image: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 0, 0, 0.03) 2px,
                    rgba(255, 0, 0, 0.03) 4px
            );
        }

        .terminal-container {
            max-width: 950px;
            margin: 0 auto;
            border: 1px solid #cc0000;
            box-shadow: 0 0 25px rgba(204, 0, 0, 0.25), inset 0 0 18px rgba(204, 0, 0, 0.12);
            background-color: rgba(10, 0, 0, 0.92);
            padding: 30px 40px;
            position: relative;
        }

        .terminal-container::before {
            content: "ADMIN.COMMAND.CENTER // RESTRICTED ACCESS";
            position: absolute;
            top: -10px;
            left: 20px;
            background-color: #050000;
            color: #ff0000;
            padding: 0 10px;
            font-size: 0.8em;
            letter-spacing: 2px;
            border-left: 1px solid #cc0000;
            border-right: 1px solid #cc0000;
        }

        h2 {
            color: #ff0000;
            text-shadow: 0 0 8px #ff0000, 0 0 15px #aa0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #330000;
            padding-bottom: 10px;
            margin-top: 0;
        }

        h3 {
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 35px;
            border-left: 3px solid #ff0000;
            padding-left: 10px;
        }

        a {
            color: #ff6666;
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        a:hover {
            color: #ffffff;
            background-color: #aa0000;
            border: 1px solid #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        .nav-links {
            margin-bottom: 25px;
        }

        .panel {
            border: 1px solid #660000;
            background-color: rgba(20, 0, 0, 0.75);
            box-shadow: inset 0 0 12px rgba(255, 0, 0, 0.08);
            padding: 22px;
            margin-top: 20px;
        }

        label {
            color: #ff9999;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            background-color: #090000;
            color: #ffcccc;
            border: 1px solid #660000;
            outline: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.35);
            background-color: #120000;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .form-row {
            margin-bottom: 16px;
        }

        .file-zone {
            margin-bottom: 18px;
            padding: 15px;
            border: 1px dashed #ff0000;
            background-color: rgba(30, 0, 0, 0.75);
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.12);
        }

        input[type="file"] {
            border: none;
            padding-left: 0;
            color: #ffcccc;
        }

        button {
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff;
            background-color: #770000;
            border: 1px solid #ff0000;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.25);
        }

        button:hover {
            background-color: #aa0000;
            box-shadow: 0 0 15px #ff0000;
            transform: translateY(-1px);
        }

        .target-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .target-card {
            margin-bottom: 12px;
            padding: 15px;
            border: 1px solid #550000;
            background-color: rgba(15, 0, 0, 0.85);
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .target-card:hover {
            border-color: #ff0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.28), inset 0 0 12px rgba(255, 0, 0, 0.08);
        }

        .target-title {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.45);
            text-transform: uppercase;
        }

        .target-points {
            color: #ff9999;
        }

        .file-badge {
            color: #ffcccc;
            border: 1px solid #990000;
            padding: 3px 7px;
            margin-left: 8px;
            background-color: rgba(80, 0, 0, 0.45);
            font-size: 0.9em;
        }

        .empty-state {
            color: #990000;
            border: 1px dashed #660000;
            padding: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-warning {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px dashed #660000;
            color: #990000;
            font-size: 0.85em;
            text-align: center;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #ff0000;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <h2>Admin Command Center <span class="cursor">_</span></h2>

    <div class="nav-links">
        <a th:href="@{/logout}">[ DISCONNECT ]</a>
    </div>

    <div class="panel">
        <h3>Deploy New Target</h3>

        <form th:action="@{/admin/challenge/add}" method="post" enctype="multipart/form-data">

            <div class="form-row">
                <label>Title:</label>
                <input type="text" name="title" required />
            </div>

            <div class="form-row">
                <label>Category:</label>
                <input type="text" name="category" required placeholder="Forensics, Pwn, Crypto..." />
            </div>

            <div class="form-row">
                <label>Description / Intel:</label>
                <textarea name="description" required></textarea>
            </div>

            <div class="form-row">
                <label>Points:</label>
                <input type="number" name="points" required />
            </div>

            <div class="form-row">
                <label>Flag:</label>
                <input type="text" name="flag" required placeholder="CRUD{...}" />
            </div>

            <div class="file-zone">
                <label>Attach Target File:</label>
                <input type="file" name="challengeFile" />
            </div>

            <button type="submit">Deploy Target</button>
        </form>
    </div>

    <div class="panel">
        <h3>Active Targets Deployed</h3>

        <ul class="target-list" th:if="${!#lists.isEmpty(challenges)}">
            <li class="target-card" th:each="challenge : ${challenges}">
                <span class="target-title" th:text="${challenge.title}">Title</span>
                <span class="target-points">
                    //
                    <span th:text="${challenge.points}">0</span> pts
                </span>

                <span class="file-badge" th:if="${challenge.fileName != null}">
                    📎 <span th:text="${challenge.fileName}">file</span>
                </span>
            </li>
        </ul>

        <div class="empty-state" th:if="${#lists.isEmpty(challenges)}">
            No active targets detected.
        </div>
    </div>

    <div class="footer-warning">
        WARNING: ADMINISTRATIVE ACTIONS ARE LOGGED AND MIRRORED TO SECURITY ARCHIVES.<br>
        COMMAND CENTER ACCESS IS LIMITED TO AUTHORIZED OPERATORS ONLY.
    </div>
</div>

</body>
</html>
