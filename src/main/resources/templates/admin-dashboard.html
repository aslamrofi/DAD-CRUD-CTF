<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRUD CTF - Command Center</title>
</head>
<body>
<h2>Admin Command Center</h2>
<a th:href="@{/logout}">[ Disconnect ]</a>
<hr>

<h3>Deploy New Target</h3>

<form th:action="@{/admin/challenge/add}" method="post" enctype="multipart/form-data" style="max-width: 500px;">

    <div style="margin-bottom: 10px;">
        <label>Title:</label><br>
        <input type="text" name="title" required style="width: 100%;" />
    </div>

    <div style="margin-bottom: 10px;">
        <label>Category (e.g., Forensics, Pwn, Crypto):</label><br>
        <input type="text" name="category" required style="width: 100%;" />
    </div>

    <div style="margin-bottom: 10px;">
        <label>Description (Intel):</label><br>
        <textarea name="description" required style="width: 100%; height: 80px;"></textarea>
    </div>

    <div style="margin-bottom: 10px;">
        <label>Points:</label><br>
        <input type="number" name="points" required style="width: 100%;" />
    </div>

    <div style="margin-bottom: 10px;">
        <label>Flag (e.g., CRUD{...}):</label><br>
        <input type="text" name="flag" required style="width: 100%;" />
    </div>

    <div style="margin-bottom: 15px; padding: 10px; border: 1px dashed #00ffcc; background-color: #1a1a1a;">
        <label style="color: #00ffcc; font-weight: bold;">Attach Target File (Optional):</label><br><br>
        <input type="file" name="challengeFile" style="color: white;" />
    </div>

    <button type="submit" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">Deploy Target</button>
</form>

<hr>

<h3>Active Targets Deployed</h3>
<ul>
    <li th:each="challenge : ${challenges}" style="margin-bottom: 5px;">
        <strong th:text="${challenge.title}">Title</strong> -
        <span th:text="${challenge.points}">0</span> pts

        <span th:if="${challenge.fileName != null}" style="color: limegreen;">
                [📎 <span th:text="${challenge.fileName}">file</span>]
            </span>
    </li>
</ul>

</body>
</html>
